# Keeps the free Render instance awake 24/7 (Render sleeps after ~15 min without traffic).
# Runs on GitHub’s servers every 5 minutes, so it works with your laptop off.
name: keep-render-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the dashboard
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 90 https://mexc-ema200-dashboard.onrender.com/spikes-ver
